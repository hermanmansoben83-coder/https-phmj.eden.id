<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jemaat Eden Mansoben | GKI di Tanah Papua</title>
  <link rel="icon" href="https://z-cdn-media.chatglm.cn/files/4fabba54-2f26-438b-b40e-398b13caf196.png?auth_key=1889554295-cc7a6a9c56ee486f87310ec34f34e44a-0-f2a1c7614b95bb965c91af1bcef7ef30" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { primary: '#1B4D3E', gold: '#D4AF37', bg: '#F4F7F6', 'deep-sky': '#0C4A6E', 'gold-accent': '#FBBF24', teal: '#0D9488', sky: '#0369A1', crimson: '#B91C1C', skyLight: '#F0F9FF' },
        fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['"Playfair Display"', 'serif'], display: ['"Cormorant Garamond"', 'serif'] },
        boxShadow: { 'soft': '0 2px 15px -3px rgba(0,0,0,0.07), 0 10px 20px -2px rgba(0,0,0,0.04)', 'card': '0 10px 40px -10px rgba(0,0,0,0.15)', 'glow': '0 0 30px -5px rgba(212,175,55,0.4)' }
      } }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
    .font-display { font-family: 'Cormorant Garamond', serif; }
    .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in-slow { animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1); }
    .slide-up { animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    .btn-delete-pro { background-color: rgba(239, 68, 68, 0.1); color: #dc2626; transition: all 0.2s; }
    .btn-delete-pro:hover { background-color: #dc2626; color: white; transform: scale(1.05); }
    #preloader { position: fixed; inset: 0; background: linear-gradient(135deg, #0C4A6E 0%, #1B4D3E 100%); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
    .loader-circle { width: 70px; height: 70px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #FBBF24; border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 30px rgba(251,191,36,0.3); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .preloader-text { letter-spacing: 0.4em; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .gradient-text { background: linear-gradient(135deg, #D4AF37 0%, #FBBF24 50%, #D4AF37 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .card-hover { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 20px 50px -10px rgba(0,0,0,0.25); }
    .nav-link { position: relative; transition: color 0.3s; }
    .nav-link::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: #D4AF37; transition: width 0.3s ease; }
    .nav-link:hover::after { width: 100%; }
    .glass { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    .image-zoom { transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
    .group:hover .image-zoom { transform: scale(1.08); }
    .ornament-line { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .ornament-line::before, .ornament-line::after { content: ''; height: 1px; width: 60px; background: linear-gradient(to right, transparent, #D4AF37, transparent); }
  </style>
</head>
<body class="bg-bg dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">
  <div id="preloader">
    <div class="loader-circle mb-6"></div>
    <h2 class="text-white text-xl font-bold preloader-text">EDEN MANSOBEN</h2>
    <p class="text-blue-200/60 text-xs mt-2 tracking-widest">GKI DI TANAH PAPUA</p>
  </div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;
    const AppContext = createContext();
    const useApp = () => useContext(AppContext);
    const STORAGE_KEY = 'eden_cms_pro_v9';
    const SESSION_KEY = 'eden_session_v9';

    const defaultData = {
      darkMode: false,
      siteSettings: {
        namaGereja: "JEMAAT EDEN MANSOBEN", organisasi: "GKI DI TANAH PAPUA", klalis: "KLASIS SUPIORI UTARA",
        alamat: "Waryesi, Supiori Timur, Kabupaten Supiori, Papua", telepon: "081243746402", whatsapp: "6281243746402",
        email: "info@edenmansoben.org",
        logo: "https://z-cdn-media.chatglm.cn/files/4fabba54-2f26-438b-b40e-398b13caf196.png?auth_key=1889554295-cc7a6a9c56ee486f87310ec34f34e44a-0-f2a1c7614b95bb965c91af1bcef7ef30",
        heroImage: "https://z-cdn-media.chatglm.cn/files/6fdf665f-8a15-42cd-a4ae-c7d2870d3b61.jpg?auth_key=1890418786-9b930747aac1472db316be621631d4a7-0-ed18eb9a9c29ad848d744f24ccb425d7",
        heroSideImage: "https://z-cdn-media.chatglm.cn/files/31d6dce0-f8c7-4745-8bca-621d982cb8ce.jpg?auth_key=1890293815-c35f59220123482a90eb3ec39872731c-0-5a117b0c0a07e257e4e12d1f8e378876"
      },
      news: [], sermons: [], schedules: [], mimbarItems: [], albums: [], mediaItems: [], waMessages: [],
      greeting: { text: "Selamat datang di website Jemaat Eden Mansoben. Marilah kita bertumbuh dalam iman dan melayani dengan kasih.", name: "Pendeta Jemaat", photoBase64: "", isVisible: true },
      aboutContent: { profil: "Profil gereja belum diisi.", sejarah: "Sejarah gereja belum diisi.", visi: "Visi gereja belum diisi.", misi: "Misi gereja belum diisi.", struktur: "Struktur organisasi belum diisi.", infoKetua: "Info ketua jemaat belum diisi." }
    };

    const AppProvider = ({ children }) => {
      const [appData, setAppData] = useState(defaultData);
      const [isAdmin, setIsAdmin] = useState(false);
      const [toast, setToast] = useState(null);
      const [isLoaded, setIsLoaded] = useState(false);

      useEffect(() => {
        const session = sessionStorage.getItem(SESSION_KEY);
        if (session) { try { const sessData = JSON.parse(atob(session)); if (sessData.expiry > Date.now()) setIsAdmin(true); else sessionStorage.removeItem(SESSION_KEY); } catch (e) { sessionStorage.removeItem(SESSION_KEY); } }
        localforage.getItem(STORAGE_KEY).then(savedData => {
          if (savedData) setAppData(prev => ({ ...prev, ...savedData }));
          setIsLoaded(true);
          const preloader = document.getElementById('preloader');
          if (preloader) { preloader.style.opacity = '0'; setTimeout(() => preloader.style.display = 'none', 600); }
        }).catch(() => setIsLoaded(true));
      }, []);

      useEffect(() => {
        if (isLoaded) {
          localforage.setItem(STORAGE_KEY, appData).catch(err => console.error(err));
          document.documentElement.classList.toggle('dark', appData.darkMode);
        }
      }, [appData, isLoaded]);

      const updateData = (key, value) => setAppData(prev => ({ ...prev, [key]: value }));
      const login = (u, p) => { if (btoa(`${u}:${p}`) === btoa('admin:iar211')) { const sess = btoa(JSON.stringify({ user: 'admin', expiry: Date.now() + 3600000 })); sessionStorage.setItem(SESSION_KEY, sess); setIsAdmin(true); return true; } return false; };
      const logout = () => { sessionStorage.removeItem(SESSION_KEY); setIsAdmin(false); };
      const showToast = (message, type = 'success') => { setToast({ message, type, id: Date.now() }); setTimeout(() => setToast(null), 3000); };

      return <AppContext.Provider value={{ ...appData, isAdmin, login, logout, updateData, setAppData, showToast }}>
        {children}
        {toast && (
          <div className="fixed top-5 right-5 z-[100] fade-in">
            <div className={`flex items-center gap-3 px-6 py-4 rounded-xl shadow-card text-white ${toast.type === 'success' ? 'bg-teal' : 'bg-crimson'}`}>
              <Icon name={toast.type === 'success' ? 'check-circle' : 'alert-circle'} className="w-6 h-6" />
              <span className="font-medium">{toast.message}</span>
            </div>
          </div>
        )}
      </AppContext.Provider>;
    };

    const Icon = ({ name, className }) => { useEffect(() => { if (window.lucide) lucide.createIcons(); }, [name]); return <i data-lucide={name} className={className}></i>; };
    const formatDate = (d) => { if (!d) return ""; const m = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des']; const dt = new Date(d); return isNaN(dt) ? d : `${dt.getDate()} ${m[dt.getMonth()]} ${dt.getFullYear()}`; };
    const uid = () => (window.crypto ? crypto.randomUUID() : Date.now() + Math.random().toString(36).substr(2, 9));

    const compressImage = (file, maxWidth = 1280, quality = 0.8) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image(); img.src = event.target.result;
          img.onload = () => {
            let canvas = document.createElement('canvas');
            if (img.width > maxWidth) { const scale = maxWidth / img.width; canvas.width = maxWidth; canvas.height = img.height * scale; } else { canvas.width = img.width; canvas.height = img.height; }
            let ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    };

    const FileUploader = ({ onUpload, label, accept = "image/*", className = "" }) => {
      const ref = useRef(null);
      const [isUploading, setIsUploading] = useState(false);
      const handleChange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setIsUploading(true);
        try {
          if (file.type.includes("image")) {
            if (file.size > 10 * 1024 * 1024) { alert("Ukuran gambar maksimal 10MB."); return; }
            const compressed = await compressImage(file); onUpload(compressed);
          } else if (file.type.includes("video")) {
            if (file.size > 10 * 1024 * 1024) { alert("Ukuran video lokal maksimal 10MB untuk penyimpanan permanen. Jika lebih, gunakan link YouTube."); return; }
            const reader = new FileReader();
            reader.onloadend = () => onUpload(reader.result);
            reader.readAsDataURL(file);
          }
        } catch (err) { alert("Gagal mengupload file."); } finally { setIsUploading(false); }
      };
      return (
        <div className={className}>
          <label className="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">{label}</label>
          <button type="button" onClick={() => ref.current.click()} disabled={isUploading} className="w-full px-4 py-3 border border-dashed border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 hover:border-sky transition-colors flex items-center justify-center gap-2 disabled:opacity-50">
            {isUploading ? <Icon name="loader" className="w-5 h-5 animate-spin" /> : <Icon name="upload-cloud" className="w-5 h-5" />}
            {isUploading ? "Memproses..." : "Pilih File"}
          </button>
          <input ref={ref} type="file" accept={accept} className="hidden" onChange={handleChange} />
        </div>
      );
    };

    const Navbar = ({ navigate }) => {
      const { darkMode, isAdmin, updateData, siteSettings, waMessages } = useApp();
      const [isOpen, setIsOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      const infoLinks = [{ name: "Tentang", path: "/tentang" }, { name: "Jadwal", path: "/jadwal" }, { name: "Khotbah", path: "/khotbah" }, { name: "Berita", path: "/berita" }];
      const mediaLinks = [{ name: "Galeri Foto", path: "/media/foto" }, { name: "Video", path: "/media/video" }];
      const mimbarLinks = [{ name: "Artikel", path: "/mimbar/artikel" }, { name: "Khotbah", path: "/mimbar/khotbah" }, { name: "Renungan", path: "/mimbar/renungan" }, { name: "Puisi", path: "/mimbar/puisi" }, { name: "Umum", path: "/mimbar/umum" }];
      const unreadCount = waMessages.filter(m => m.status === 'Baru').length;

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <header className={`sticky top-0 z-50 w-full bg-skyLight/95 dark:bg-gray-800/95 glass shadow-md transition-all duration-300 ${scrolled ? 'shadow-lg' : ''}`}>
          {isAdmin && unreadCount > 0 && (
            <div className="bg-gold-accent text-deep-sky py-2 text-center text-sm font-semibold">
              <Icon name="mail" className="w-4 h-4 inline-block mr-2" /> Anda memiliki {unreadCount} pesan baru. 
              <button onClick={() => navigate('/admin')} className="underline ml-2 font-bold">Lihat Pesan</button>
            </div>
          )}
          <div className="hidden md:block bg-primary text-white text-xs">
            <div className="container mx-auto flex justify-between items-center py-2 px-4">
              <span className="tracking-wide">{siteSettings.organisasi} — {siteSettings.klalis}</span>
              <div className="flex items-center gap-4">
                <button onClick={() => updateData('darkMode', !darkMode)} className="flex items-center gap-1.5 hover:text-gold transition-colors"><Icon name={darkMode ? "sun" : "moon"} className="w-3.5 h-3.5" /> {darkMode ? "Light" : "Dark"} Mode</button>
                <span className="text-white/30">|</span>
                <button onClick={() => navigate(isAdmin ? '/admin' : '/login')} className="flex items-center gap-1.5 hover:text-gold transition-colors"><Icon name="lock" className="w-3.5 h-3.5" /> {isAdmin ? 'Dashboard' : 'Login Admin'}</button>
              </div>
            </div>
          </div>
          <nav className="container mx-auto flex justify-between items-center py-3 px-4">
            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => navigate('/')}>
              <img src={siteSettings.logo} className="h-12 w-12 object-contain transition-transform group-hover:scale-105" alt="Logo GKI" />
              <div>
                <span className="font-bold text-primary dark:text-white text-lg block leading-tight">{siteSettings.namaGereja}</span>
                <span className="text-[10px] text-gray-500 dark:text-gray-400 tracking-widest uppercase">GKI di Tanah Papua</span>
              </div>
            </div>
            <div className="hidden lg:flex items-center gap-7">
              <button onClick={() => navigate('/')} className="nav-link text-sm font-medium text-gray-700 dark:text-gray-200 hover:text-primary dark:hover:text-gold">Beranda</button>
              <div className="relative group">
                <button className="nav-link flex items-center gap-1 text-sm font-medium text-gray-700 dark:text-gray-200 hover:text-primary dark:hover:text-gold">Mimbar <Icon name="chevron-down" className="w-4 h-4" /></button>
                <div className="absolute left-0 mt-2 w-72 bg-white dark:bg-gray-800 shadow-card rounded-xl border dark:border-gray-700 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 pt-1 grid grid-cols-2 gap-0 overflow-hidden">
                  {mimbarLinks.map(l => <button key={l.path} onClick={() => navigate(l.path)} className="block w-full text-left px-4 py-3 text-sm hover:bg-skyLight dark:hover:bg-gray-700 border-b dark:border-gray-700 transition-colors hover:text-sky hover:pl-5">{l.name}</button>)}
                </div>
              </div>
              <div className="relative group">
                <button className="nav-link flex items-center gap-1 text-sm font-medium text-gray-700 dark:text-gray-200 hover:text-primary dark:hover:text-gold">Informasi <Icon name="chevron-down" className="w-4 h-4" /></button>
                <div className="absolute left-0 mt-2 w-56 bg-white dark:bg-gray-800 shadow-card rounded-xl border dark:border-gray-700 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 pt-1 overflow-hidden">
                  {infoLinks.map(l => <button key={l.path} onClick={() => navigate(l.path)} className="block w-full text-left px-4 py-3 text-sm hover:bg-skyLight dark:hover:bg-gray-700 border-b dark:border-gray-700 last:border-0 transition-colors hover:text-sky hover:pl-5">{l.name}</button>)}
                </div>
              </div>
              <div className="relative group">
                <button className="nav-link flex items-center gap-1 text-sm font-medium text-gray-700 dark:text-gray-200 hover:text-primary dark:hover:text-gold">Media <Icon name="chevron-down" className="w-4 h-4" /></button>
                <div className="absolute left-0 mt-2 w-56 bg-white dark:bg-gray-800 shadow-card rounded-xl border dark:border-gray-700 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 pt-1 overflow-hidden">
                  {mediaLinks.map(l => <button key={l.path} onClick={() => navigate(l.path)} className="block w-full text-left px-4 py-3 text-sm hover:bg-skyLight dark:hover:bg-gray-700 border-b dark:border-gray-700 last:border-0 transition-colors hover:text-sky hover:pl-5">{l.name}</button>)}
                </div>
              </div>
              <button onClick={() => navigate('/kontak')} className="nav-link text-sm font-medium text-gray-700 dark:text-gray-200 hover:text-primary dark:hover:text-gold">Kontak</button>
            </div>
            <button className="lg:hidden" onClick={() => setIsOpen(!isOpen)}><Icon name={isOpen ? "x" : "menu"} className="w-7 h-7 text-primary dark:text-white" /></button>
          </nav>
          {isOpen && (
            <div className="lg:hidden bg-skyLight dark:bg-gray-800 border-t dark:border-gray-700 p-4 flex flex-col gap-1 fade-in">
              <button onClick={() => { navigate('/'); setIsOpen(false); }} className="text-left py-3 border-b dark:border-gray-700 font-medium hover:text-sky transition-colors">Beranda</button>
              {mimbarLinks.map(l => <button key={l.path} onClick={() => { navigate(l.path); setIsOpen(false); }} className="text-left py-3 border-b dark:border-gray-700 hover:text-sky transition-colors">{l.name}</button>)}
              {infoLinks.map(l => <button key={l.path} onClick={() => { navigate(l.path); setIsOpen(false); }} className="text-left py-3 border-b dark:border-gray-700 hover:text-sky transition-colors">{l.name}</button>)}
              {mediaLinks.map(l => <button key={l.path} onClick={() => { navigate(l.path); setIsOpen(false); }} className="text-left py-3 border-b dark:border-gray-700 hover:text-sky transition-colors">{l.name}</button>)}
              <button onClick={() => navigate(isAdmin ? '/admin' : '/login')} className="bg-gold text-white px-4 py-2.5 rounded-lg text-sm font-semibold mt-2 shadow-md">{isAdmin ? 'Dashboard' : 'Login Admin'}</button>
            </div>
          )}
        </header>
      );
    };

    const Hero = () => {
      const { siteSettings } = useApp();
      return (
        <section className="relative overflow-hidden min-h-[92vh] flex items-center bg-deep-sky">
          <div className="absolute inset-0 z-0">
            <img src={siteSettings.heroImage} className="w-full h-full object-cover" alt="Latar" />
            <div className="absolute inset-0 bg-gradient-to-r from-primary/95 via-primary/80 to-primary/30 dark:from-gray-900/95 dark:via-gray-900/80 dark:to-gray-900/40"></div>
            <div className="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>
          </div>
          <div className="container mx-auto px-4 py-16 md:py-24 grid md:grid-cols-2 gap-12 items-center fade-in relative z-10">
            <div className="text-white slide-up">
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/20 backdrop-blur-sm mb-6">
                <span className="w-2 h-2 rounded-full bg-gold-accent animate-pulse"></span>
                <span className="text-xs tracking-widest uppercase text-blue-100">Selamat Datang</span>
              </div>
              <h1 className="text-white leading-tight mb-4 tracking-wide font-serif" style={{ fontStyle: 'italic', fontWeight: '700', fontSize: 'clamp(28px, 5vw, 44px)' }}>
                SELAMAT DATANG DI <span className="gradient-text block mt-1">{siteSettings.namaGereja}</span>
              </h1>
              <p className="text-base font-semibold text-blue-100 mb-6 tracking-wide">{siteSettings.organisasi} — {siteSettings.klalis}</p>
              <p className="text-lg italic font-display text-blue-50/90 mb-8 border-l-4 border-gold pl-5 text-xl leading-relaxed">"Bertumbuh dalam Kristus, Melayani dengan Kasih."</p>
              <div className="flex gap-4 flex-wrap">
                <button onClick={() => window.location.hash = '/jadwal'} className="bg-gold text-primary px-7 py-3.5 rounded-lg font-semibold hover:bg-gold-accent transition-all shadow-glow hover:scale-105 flex items-center gap-2"><Icon name="calendar-days" className="w-5 h-5"/> Jadwal Ibadah</button>
                <button onClick={() => window.location.hash = '/tentang'} className="border-2 border-white/80 text-white px-7 py-3.5 rounded-lg font-semibold hover:bg-white hover:text-primary transition-all backdrop-blur-sm">Tentang Kami</button>
              </div>
            </div>
            <div className="relative w-full max-w-sm mx-auto md:ml-auto rounded-2xl overflow-hidden shadow-2xl ring-4 ring-white/30 dark:ring-gray-700/50 bg-white/10 backdrop-blur-sm fade-in-slow">
              <img src={siteSettings.heroSideImage} className="w-full h-auto block object-contain aspect-video" alt="Gereja" />
              <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-4">
                <p className="text-white text-xs font-medium tracking-wide">Soli Deo Gloria</p>
              </div>
            </div>
          </div>
          <div className="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-bg dark:from-gray-900 to-transparent z-10"></div>
        </section>
      );
    };

    const VideoPlayer = ({ src, onClose }) => {
      const videoRef = useRef(null);
      const [playing, setPlaying] = useState(true);
      const [progress, setProgress] = useState(0);
      const [duration, setDuration] = useState(0);

      const handleSeek = (e) => { const rect = e.currentTarget.getBoundingClientRect(); const newTime = ((e.clientX - rect.left) / rect.width) * videoRef.current.duration; if (videoRef.current) videoRef.current.currentTime = newTime; };

      return (
        <div className="fixed inset-0 bg-black/95 z-[60] flex flex-col items-center justify-center p-4 fade-in" onClick={onClose}>

                <span className="text-xs font-mono">{Math.floor(progress/100 * duration)}s / {Math.floor(duration)}s</span>

                    <div>
                      <label className="block text-xs font-medium text-gray-700 mb-1">Upload Video (Maks 10MB, disimpan permanen)</label>
                      <input id="vid-file-input" name="videoFile" type="file" accept="video/*" className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none transition-all" />
                    </div>
                    <div><label className="block text-xs font-medium text-gray-700 mb-1">Atau Link YouTube</label><input name="url" type="text" placeholder="https://youtube.com/watch?v=..." className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none transition-all" /></div>
                    <FileUploader label="Upload Thumbnail (Opsional)" onUpload={(url) => document.getElementById('vid-thumb').value = url} />
                    <input id="vid-thumb" name="thumbnail" type="hidden" />
                    <button className="w-full bg-rose-600 text-white py-3 rounded-lg font-semibold hover:bg-rose-700 flex items-center justify-center gap-2 transition-colors shadow-sm"><Icon name="save" className="w-5 h-5"/> Simpan Video</button>
                  </form>
                </div>

                <div className="bg-white rounded-xl shadow-soft overflow-hidden border border-gray-100 mt-8">
                  <h3 className="text-lg font-bold text-gray-700 p-4 bg-gray-50 font-serif">Daftar Media (Foto & Video)</h3>
                  <div className="overflow-x-auto scrollbar-thin">
                    <table className="w-full text-left">
                      <thead className="bg-gray-100 text-gray-700 text-sm"><tr><th className="p-4">Pratinjau</th><th className="p-4">Judul</th><th className="p-4">Status</th><th className="p-4 text-right">Aksi</th></tr></thead>
                      <tbody>
                        {mediaItems.map(m => (
                          <tr key={m.id} className="border-t text-sm hover:bg-gray-50 transition-colors">
                            <td className="p-2"><div className="w-16 h-12 bg-gray-100 rounded overflow-hidden">{m.type === 'video' ? <div className="w-full h-full flex items-center justify-center bg-gray-800"><Icon name="play" className="w-5 h-5 text-white" /></div> : <img src={m.url} className="w-full h-full object-cover" alt={m.title} />}</div></td>
                            <td className="p-4 font-medium text-gray-800">{m.title || "Tanpa Judul"}</td>
                            <td className="p-4"><span className={`text-xs px-2 py-1 rounded ${m.status === 'Published' ? 'bg-green-100 text-green-700' : 'bg-gray-100'}`}>{m.status || 'Published'}</span></td>
                            <td className="p-4 text-right"><DeleteBtn onClick={() => { if (window.confirm(`Hapus "${m.title || 'media ini'}"?`)) { updateData('mediaItems', mediaItems.filter(x => x.id !== m.id)); showToast("Media dihapus permanen", "success"); } }} /></td>
                          </tr>
                        ))}
                        {mediaItems.length === 0 && <tr><td colSpan="4" className="p-8 text-center text-gray-400">Belum ada media.</td></tr>}
                      </tbody>
                    </table>
                  </div>
                </div>
                <datalist id="cat-list"><option>Ibadah</option><option>Pelayanan</option><option>PAM</option><option>PKB</option><option>PW</option><option>PAR</option><option>KSP</option><option>Rayon</option><option>Umum</option></datalist>
              </div>
            )}

            {view === 'messages' && (
              <div>
                <h1 className="text-2xl font-bold text-sky mb-6 font-serif">Pesan Masuk</h1>
                <div className="bg-white rounded-xl shadow-soft overflow-hidden border border-gray-100">
                  <div className="overflow-x-auto scrollbar-thin">
                    <table className="w-full text-left">
                      <thead className="bg-gray-100 text-gray-700 text-sm"><tr><th className="p-4">Nama</th><th className="p-4">Email</th><th className="p-4">Pesan</th><th className="p-4">Status</th><th className="p-4 text-right">Aksi</th></tr></thead>
                      <tbody>
                        {waMessages.map(msg => (
                          <tr key={msg.id} className="border-t text-sm hover:bg-gray-50 transition-colors">
                            <td className="p-4 font-bold">{msg.name}</td>
                            <td className="p-4 text-gray-600">{msg.email}</td>
                            <td className="p-4 text-gray-600 max-w-xs truncate">{msg.message}</td>
                            <td className="p-4"><span className={`text-xs px-2 py-1 rounded ${msg.status === 'Baru' ? 'bg-red-100 text-red-700' : 'bg-gray-100'}`}>{msg.status}</span></td>
                            <td className="p-4 text-right flex gap-1 justify-end">
                              {msg.status === 'Baru' && <button onClick={() => { setAppData(prev => ({...prev, waMessages: prev.waMessages.map(m => m.id === msg.id ? {...m, status: 'Dibaca'} : m)})); showToast('Pesan ditandai dibaca'); }} className="inline-flex items-center gap-1 text-xs font-semibold px-3 py-2 rounded-md shadow-sm bg-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white transition-colors"><Icon name="check" className="w-3.5 h-3.5" /> Tandai Dibaca</button>}
                              <DeleteBtn onClick={() => { if(window.confirm('Hapus pesan ini?')) setAppData(prev => ({...prev, waMessages: prev.waMessages.filter(m => m.id !== msg.id)})); }} />
                            </td>
                          </tr>
                        ))}
                        {waMessages.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-gray-400">Belum ada pesan masuk.</td></tr>}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    };

    const LoginScreen = ({ navigate }) => {
      const { login, siteSettings } = useApp();
      const [error, setError] = useState('');
      const handleLogin = (e) => { e.preventDefault(); const fd = new FormData(e.target); if (login(fd.get('username'), fd.get('password'))) { navigate('/admin'); } else { setError('Username atau Password salah!'); } };
      return (
        <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-skyLight via-skyLight to-blue-100 dark:from-gray-900 dark:via-gray-900 dark:to-gray-800 p-4">
          <div className="bg-white p-8 rounded-2xl shadow-card w-full max-w-md text-center border-t-8 border-sky fade-in">
            <img src={siteSettings.logo} className="w-20 h-20 mx-auto mb-4 object-contain" alt="Logo" />
            <h2 className="text-2xl font-bold text-sky mb-1 font-serif">Login Sistem</h2>
            <p className="text-sm text-gray-500 mb-6">Panel Administrasi Gereja</p>
            <form onSubmit={handleLogin} className="space-y-4 text-left">
              <input type="text" name="username" required placeholder="Username" className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-sky focus:outline-none transition-all" />
              <input type="password" name="password" required placeholder="Password" className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-sky focus:outline-none transition-all" />
              {error && <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-sm text-center fade-in">{error}</div>}
              <button type="submit" className="w-full bg-gradient-to-r from-sky to-blue-700 text-white py-3.5 rounded-lg font-semibold hover:shadow-lg transition-all flex items-center justify-center gap-2"><Icon name="log-in" className="w-5 h-5"/> MASUK</button>
            </form>
            <button onClick={() => navigate('/')} className="mt-4 text-sm text-gray-500 hover:text-sky transition-colors">← Kembali ke Beranda</button>
          </div>
        </div>
      );
    };

    const Footer = ({ navigate }) => {
      const { siteSettings } = useApp();
      return (
        <footer className="bg-gradient-to-b from-primary to-primary/95 dark:from-gray-900 dark:to-gray-950 text-white pt-16 pb-8 relative overflow-hidden">
          <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-gold to-transparent"></div>
          <div className="container mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8 mb-12">
            <div>
              <div className="flex items-center gap-3 mb-4">
                <img src={siteSettings.logo} className="h-12 w-12 object-contain bg-white rounded-full p-1" alt="Logo" />
                <div>
                  <h4 className="font-bold text-lg font-serif">{siteSettings.namaGereja}</h4>
                  <p className="text-xs text-gold tracking-wide">Soli Deo Gloria</p>
                </div>
              </div>
              <p className="text-sm text-gray-300 leading-relaxed">{siteSettings.klalis}</p>
            </div>
            <div>
              <h4 className="font-bold text-gold mb-4 uppercase text-sm tracking-wide">Menu</h4>
              <ul className="space-y-2.5 text-gray-300 text-sm">
                <li><button onClick={() => navigate('/')} className="hover:text-gold transition-colors">Beranda</button></li>
                <li><button onClick={() => navigate('/berita')} className="hover:text-gold transition-colors">Berita</button></li>
                <li><button onClick={() => navigate('/media/foto')} className="hover:text-gold transition-colors">Galeri Foto</button></li>
              </ul>
            </div>
            <div>
              <h4 className="font-bold text-gold mb-4 uppercase text-sm tracking-wide">Informasi</h4>
              <ul className="space-y-2.5 text-gray-300 text-sm">
                <li><button onClick={() => navigate('/jadwal')} className="hover:text-gold transition-colors">Jadwal Ibadah</button></li>
                <li><button onClick={() => navigate('/tentang')} className="hover:text-gold transition-colors">Tentang Kami</button></li>
                <li><button onClick={() => navigate('/kontak')} className="hover:text-gold transition-colors">Kontak</button></li>
              </ul>
            </div>
            <div>
              <h4 className="font-bold text-gold mb-4 uppercase text-sm tracking-wide">Kontak</h4>
              <p className="text-sm text-gray-300 mb-3 leading-relaxed">{siteSettings.alamat}</p>
              <div className="flex gap-3 mt-3">
                <a href={`https://wa.me/${siteSettings.whatsapp}`} target="_blank" rel="noopener noreferrer" className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-gold hover:text-primary transition-all"><Icon name="message-circle" className="w-4 h-4"/></a>
                <span className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-gold hover:text-primary transition-all cursor-pointer"><Icon name="facebook" className="w-4 h-4"/></span>
                <span className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-gold hover:text-primary transition-all cursor-pointer"><Icon name="youtube" className="w-4 h-4"/></span>
              </div>
            </div>
          </div>
          <div className="border-t border-white/10 pt-8 text-center text-sm text-gray-400">
            <p>© {new Date().getFullYear()} {siteSettings.namaGereja} — {siteSettings.organisasi}. All rights reserved.</p>
          </div>
        </footer>
      );
    };

    const App = () => {
      const [route, setRoute] = useState(window.location.hash.slice(1) || '/');
      const { siteSettings } = useApp();
      useEffect(() => { const onHashChange = () => setRoute(window.location.hash.slice(1) || '/'); window.addEventListener('hashchange', onHashChange); lucide.createIcons(); return () => window.removeEventListener('hashchange', onHashChange); }, []);
      useEffect(() => { lucide.createIcons(); }, [route]);
      useEffect(() => { document.title = `${siteSettings.namaGereja} | GKI di Tanah Papua`; }, [siteSettings]);
      const navigate = (path) => { window.location.hash = path; setRoute(path); window.scrollTo(0, 0); };
      const mimbarMatch = route.match(/^\/mimbar\/(.*)$/);
      const mimbarCategory = mimbarMatch ? mimbarMatch[1] : null;
      const isMediaRoute = route.includes('/media');
      const mediaView = route.includes('/media/') ? route.split('/').pop() : 'all';

      if (route === '/admin' || route === '/login') {
        return route === '/admin' ? <AdminDashboard navigate={navigate} /> : <LoginScreen navigate={navigate} />;
      }
      return (
        <>
          <Navbar navigate={navigate} />
          {route === '/' && <Hero navigate={navigate} />}
          {route === '/tentang' && <AboutPage />}
          {route === '/jadwal' && <SchedulePage />}
          {route === '/khotbah' && <SermonPage />}
          {route === '/berita' && <NewsPage />}
          {mimbarCategory && <MimbarPage category={mimbarCategory} />}
          {isMediaRoute && <MediaPage navigate={navigate} initialView={mediaView === 'media' ? 'all' : mediaView} />}
          {route === '/kontak' && <ContactPage />}
          {!['/', '/tentang', '/jadwal', '/khotbah', '/berita', '/kontak'].includes(route) && !mimbarCategory && !isMediaRoute && (
            <div className="min-h-[60vh] flex flex-col items-center justify-center text-gray-500 fade-in">
              <Icon name="alert-triangle" className="w-20 h-20 mb-4 text-amber-500" />
              <h2 className="text-3xl font-bold mb-2 font-serif text-gray-700 dark:text-gray-200">404</h2>
              <p className="mb-4">Halaman Tidak Ditemukan</p>
              <button onClick={() => navigate('/')} className="mt-2 text-sky hover:underline font-medium">← Kembali ke Beranda</button>
            </div>
          )}
          <Footer navigate={navigate} />
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppProvider><App /></AppProvider>);
  </script>
</body>
</html>
